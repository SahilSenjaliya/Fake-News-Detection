services:
  # 1. FastAPI Machine Learning Backend Web Service
  - type: web
    name: fake-news-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
    plan: free

  # 2. Frontend User Interface Static Site
  - type: static
    name: fake-news-frontend
    buildCommand: ""
    staticPublishPath: "./frontend"
    plan: free
